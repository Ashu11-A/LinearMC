name: stage-overlay
description: >
  Stage the Canvas Linear overlay onto a weaver-APPLIED tree (must run AFTER
  applyAllPatches generates canvas-server/build.gradle.kts and
  paper-server/). Implements versions/servers/26.1.x/canvasmc/OVERLAY.md:
  every patch family is --check-gated before application so upstream drift
  fails loudly instead of landing half-applied. Stable matrix id `canvas`
  maps to the `canvasmc/` leg dir. Never stage pre-apply: the generated
  dirs do not exist yet and weaver output generation must not meet stray
  files. Core copy (step 2) is root-relative (linear-core/ at repo root)
  and needs no leg-path change.

inputs:
  version:
    description: Server line folder under versions/servers/ (e.g. '26.1.x'). Comes from the discover matrix.
    required: true
  supplement-dir:
    description: Path to the already-checked-out supplement repo.
    required: false
    default: supplement
  canvas-dir:
    description: Directory holding the applied Canvas checkout (weaver apply already run). Must not be named 'folia'.
    required: false
    default: fork
  include-tests:
    description: Stage tests/** into canvas-server/src/test/java (preserving packages). Keep 'true' for compile/test jobs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Stage Canvas overlay (check-gated)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SUPPLEMENT_DIR: ${{ inputs.supplement-dir }}
        CANVAS_DIR: ${{ inputs.canvas-dir }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
      run: |
        # Same script as local builds (check-gated overlay, core, paper-server files, deps, tests).
        bash "$SUPPLEMENT_DIR/scripts/stage.sh" canvas "$CANVAS_DIR" --line "$VERSION" --overlay-only \
          $([ "$INCLUDE_TESTS" = true ] || echo --no-tests)
