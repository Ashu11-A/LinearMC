name: stage-overlay
description: >
  Stage the Canvas Linear overlay onto a weaver-APPLIED tree (must run AFTER
  applyAllPatches generates canvas-server/build.gradle.kts and
  paper-server/). Implements versions/servers/26.1.x/canvasmc/OVERLAY.md:
  every patch family is --check-gated before application so upstream drift
  fails loudly instead of landing half-applied. Stable matrix id `canvas`
  maps to the `canvasmc/` leg dir. Never stage pre-apply: the generated
  dirs do not exist yet and weaver output generation must not meet stray
  files. Core copy (step 2) is root-relative (linear-core/ at repo root)
  and needs no leg-path change.

inputs:
  version:
    description: Server line folder under versions/servers/ (e.g. '26.1.x'). Comes from the discover matrix.
    required: true
  supplement-dir:
    description: Path to the already-checked-out supplement repo.
    required: false
    default: supplement
  canvas-dir:
    description: Directory holding the applied Canvas checkout (weaver apply already run).
    required: false
    default: folia
  include-tests:
    description: Stage tests/** into canvas-server/src/test/java (preserving packages). Keep 'true' for compile/test jobs.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Stage Canvas overlay (check-gated)
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SUPPLEMENT_DIR: ${{ inputs.supplement-dir }}
        CANVAS_DIR: ${{ inputs.canvas-dir }}
        INCLUDE_TESTS: ${{ inputs.include-tests }}
      run: |
        LEG="$SUPPLEMENT_DIR/versions/servers/$VERSION/canvasmc"
        test -f "$LEG/OVERLAY.md" || { echo "::error::Missing $LEG/OVERLAY.md"; exit 1; }
        # Absolute paths from here on: `git -C <dir> apply <patch>` resolves
        # the patch file against the -C directory, NOT the invoking cwd, so
        # relative supplement paths die with "can't open patch" (observed).
        LEG="$(cd "$LEG" && pwd)"
        CANVAS_DIR="$(cd "$CANVAS_DIR" && pwd)"
        # 0. Shared Canvas hub (version-agnostic graduates). Single implementation:
        # byte-identical files live here once; legs keep only seam adapters.
        SHARED="$SUPPLEMENT_DIR/versions/servers/common/canvas"
        test -f "$SHARED/README.md" || { echo "::error::Missing shared Canvas hub $SHARED (README.md)"; exit 1; }
        SHARED="$(cd "$SHARED" && pwd)"
        test -d "$SUPPLEMENT_DIR/linear-core" || { echo "::error::linear-core missing in supplement $SUPPLEMENT_DIR (NMS patches reference net.linear)"; exit 1; }
        # Shadow rule (hub demotion across versions): when a leg carries an
        # adapter with the SAME basename as a hub file, the leg wins and the
        # hub copy is SKIPPED for this version (loud NOTE, never silent).
        # This is how a drifted version demotes a file without forking the hub
        # (see hub README graduation/demotion rules).
        test -d "$CANVAS_DIR/paper-server/src/main/java" || { echo "::error::$CANVAS_DIR/paper-server missing: run applyAllPatches before stage-overlay"; exit 1; }
        test -d "$CANVAS_DIR/canvas-server/src/minecraft/java" || { echo "::error::$CANVAS_DIR/canvas-server/src/minecraft missing: run applyAllPatches before stage-overlay"; exit 1; }
        # 1. NMS overlay (hub graduates + leg adapters): check ALL, then apply
        # ALL (never half-apply). Hub first (minus shadows), leg adapters second.
        for p in "$SHARED"/overlay/nms/*.patch; do
          if [ -e "$LEG/overlay/nms/$(basename "$p")" ]; then
            echo "stage-overlay: NOTE shadow nms/$(basename "$p") (leg adapter overrides hub)"
            continue
          fi
          git -C "$CANVAS_DIR/canvas-server/src/minecraft/java" apply --check -p1 "$p" \
            || { echo "::error::NMS shared overlay --check failed: $p"; exit 1; }
        done
        for p in "$SHARED"/overlay/nms/*.patch; do
          [ -e "$LEG/overlay/nms/$(basename "$p")" ] && continue
          git -C "$CANVAS_DIR/canvas-server/src/minecraft/java" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::NMS shared overlay apply failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/nms/*.patch; do
          git -C "$CANVAS_DIR/canvas-server/src/minecraft/java" apply --check -p1 "$p" \
            || { echo "::error::NMS overlay --check failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/nms/*.patch; do
          git -C "$CANVAS_DIR/canvas-server/src/minecraft/java" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::NMS overlay apply failed: $p"; exit 1; }
        done
        # 2. Core sources (single codebase: linear-core owns all net.linear classes).
        # Each module contributes its full net/linear tree (recursive: top-level
        # files plus arbitrarily deep subpackage trees) preserving relative
        # paths. Destination layout mirrors the source tree.
        mkdir -p "$CANVAS_DIR/canvas-server/src/main/java/net/linear"
        for m in "$SUPPLEMENT_DIR"/linear-core/*/src/net/linear; do
          (cd "$m" && find . -name '*.java' | while IFS= read -r f; do
            dest="$CANVAS_DIR/canvas-server/src/main/java/net/linear/${f#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done)
        done
        # 3. Paper-side new files (verbatim): shared hub first (minus shadows),
        # then leg adapters. The hub and the leg store them as
        # paper-server/src/main/java/**; strip that prefix so they land on
        # the module path (a bare paper-server/** layout keeps working too).
        H_PS="$SHARED/paper-server"
        [ -d "$H_PS/src/main/java" ] && H_PS="$H_PS/src/main/java"
        L_PS="$LEG/paper-server"
        [ -d "$L_PS/src/main/java" ] && L_PS="$L_PS/src/main/java"
        test -d "$H_PS" || { echo "::error::hub paper-server tree missing: $H_PS"; exit 1; }
        test -d "$L_PS" || { echo "::error::leg paper-server tree missing: $L_PS"; exit 1; }
        (cd "$H_PS" && find . -name '*.java' | while IFS= read -r f; do
          if [ -e "$L_PS/$f" ]; then
            echo "stage-overlay: NOTE shadow paper-server/$f (leg adapter overrides hub)"
            continue
          fi
          mkdir -p "$CANVAS_DIR/paper-server/src/main/java/$(dirname "$f")"
          cp "$f" "$CANVAS_DIR/paper-server/src/main/java/$f"
        done)
        (cd "$L_PS" && find . -name '*.java' | while IFS= read -r f; do
          mkdir -p "$CANVAS_DIR/paper-server/src/main/java/$(dirname "$f")"
          cp "$f" "$CANVAS_DIR/paper-server/src/main/java/$f"
        done)
        # 4. Paper-side modifications (hub minus shadows + leg, each check-gated).
        for p in "$SHARED"/overlay/paper/*.patch; do
          if [ -e "$LEG/overlay/paper/$(basename "$p")" ]; then
            echo "stage-overlay: NOTE shadow paper/$(basename "$p") (leg adapter overrides hub)"
            continue
          fi
          git -C "$CANVAS_DIR/paper-server" apply --check -p1 "$p" \
            || { echo "::error::paper shared overlay --check failed: $p"; exit 1; }
        done
        for p in "$SHARED"/overlay/paper/*.patch; do
          [ -e "$LEG/overlay/paper/$(basename "$p")" ] && continue
          git -C "$CANVAS_DIR/paper-server" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::paper shared overlay apply failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/paper/*.patch; do
          git -C "$CANVAS_DIR/paper-server" apply --check -p1 "$p" \
            || { echo "::error::paper overlay --check failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/paper/*.patch; do
          git -C "$CANVAS_DIR/paper-server" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::paper overlay apply failed: $p"; exit 1; }
        done
        # 5. Canvas config (git-derived paths; hub minus shadows + leg, each check-gated).
        for p in "$SHARED"/overlay/config/*.patch; do
          if [ -e "$LEG/overlay/config/$(basename "$p")" ]; then
            echo "stage-overlay: NOTE shadow config/$(basename "$p") (leg adapter overrides hub)"
            continue
          fi
          git -C "$CANVAS_DIR" apply --check -p1 "$p" \
            || { echo "::error::config shared overlay --check failed: $p"; exit 1; }
        done
        for p in "$SHARED"/overlay/config/*.patch; do
          [ -e "$LEG/overlay/config/$(basename "$p")" ] && continue
          git -C "$CANVAS_DIR" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::config shared overlay apply failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/config/*.patch; do
          git -C "$CANVAS_DIR" apply --check -p1 "$p" \
            || { echo "::error::config overlay --check failed: $p"; exit 1; }
        done
        for p in "$LEG"/overlay/config/*.patch; do
          git -C "$CANVAS_DIR" apply -p1 --whitespace=nowarn "$p" \
            || { echo "::error::config overlay apply failed: $p"; exit 1; }
        done
        # 6. zstd dep (generated build file exists only post-apply).
        python3 - "$CANVAS_DIR/canvas-server/build.gradle.kts" <<'EOF'
        import re, sys
        p = sys.argv[1]
        s = open(p).read()
        dep = '    implementation("com.github.luben:zstd-jni:1.5.6-8") // Linear - whole-region zstd (same coordinate as the Folia leg)\n'
        if 'zstd-jni' not in s:
            # Prefix anchor: the httpclient version floats across lines
            # (1.0.0 on 26.1, 1.0.1 on 26.2); match the coordinate, not the version.
            m = re.search(r'    implementation\("io\.canvasmc\.httpclient:httpclient:[^"]+"\)\n', s)
            assert m, 'zstd anchor moved; update stage-overlay wiring'
            anchor = m.group(0)
            open(p, 'w').write(s.replace(anchor, anchor + dep))
            print('stage-overlay: zstd dep added')
        else:
            print('stage-overlay: zstd dep present')
        EOF
        # 7. Tests (package tree preserved; hub graduates first minus shadows,
        # then leg additions. Either tree may be absent: legs with no own tests
        # stage hub tests only. Canvas 26.2 dropped the folia-server test-srcDir
        # wiring, and Canvas has no folia-server module).
        if [ "$INCLUDE_TESTS" = "true" ]; then
          (cd "$SHARED/tests" && find . -name '*.java' | while IFS= read -r f; do
            if [ -e "$LEG/tests/$f" ]; then
              echo "stage-overlay: NOTE shadow tests/$f (leg adapter overrides hub)"
              continue
            fi
            mkdir -p "$CANVAS_DIR/canvas-server/src/test/java/$(dirname "$f")"
            cp "$f" "$CANVAS_DIR/canvas-server/src/test/java/$f"
          done)
          if [ -d "$LEG/tests" ]; then
            (cd "$LEG/tests" && find . -name '*.java' | while IFS= read -r f; do
              mkdir -p "$CANVAS_DIR/canvas-server/src/test/java/$(dirname "$f")"
              cp "$f" "$CANVAS_DIR/canvas-server/src/test/java/$f"
            done)
          fi
        fi
        echo "stage-overlay: done (hub+leg: $(($(find "$SHARED"/overlay/nms "$LEG"/overlay/nms -maxdepth 1 -name '*.patch' 2>/dev/null | wc -l))) nms, $(($(find "$SHARED"/overlay/paper "$LEG"/overlay/paper -maxdepth 1 -name '*.patch' 2>/dev/null | wc -l))) paper, $(($(find "$SHARED"/overlay/config "$LEG"/overlay/config -maxdepth 1 -name '*.patch' 2>/dev/null | wc -l))) config)"
