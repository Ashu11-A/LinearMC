# Horizon BUILD pin: the single shipped jar compiles against the oldest
# supported bundle so one jar loads on every supported MC line (api-version
# is the major.minor of MC_VERSION below). Unlike the fork legs, Horizon is
# consumed as a Gradle dev-bundle, not a fork checkout: the plugin builds
# standalone (horizon-plugin/) against the paper dev bundle below. REF tracks
# the Horizon commit (MIXIN-CONTRACT.md per-MC retrace); the dev-bundle
# coordinate itself is pinned below. CI substitutes it into
# horizon-plugin/build.gradle.kts.
# Per-MC test pins (upstream.horizon-<mc>.properties) feed the test.yml
# per-bundle matrix (compile + unit + patcher check per MC) and never
# produce a build leg.
HORIZON_REPO=https://github.com/CraftCanvasMC/Horizon.git
HORIZON_BRANCH=main
HORIZON_REF=31d1a1b70c8e0b5f5a62ded774bb9f1f8bf3e7bc
HORIZON_DEV_BUNDLE=26.1.2.build.74-stable
MC_VERSION=26.1.2
