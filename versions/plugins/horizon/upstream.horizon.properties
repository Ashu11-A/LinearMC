# Horizon upstream pin for the 26.1.x version line.
# Unlike the fork legs, Horizon is consumed as a Gradle dev-bundle, not a
# fork checkout: the plugin builds standalone (horizon-plugin/) against the
# paper dev bundle below. REF tracks the Horizon commit the mixin selectors
# were verified against (MIXIN-CONTRACT.md §26.3 retrace); the dev-bundle
# coordinate itself is pinned below (resolved from catalog 26.3.build.+;
# CI substitutes it into horizon-plugin/build.gradle.kts so a
# second versions/<line>/upstream.horizon.properties needs no workflow edit).
HORIZON_REPO=https://github.com/CraftCanvasMC/Horizon.git
HORIZON_BRANCH=main
HORIZON_REF=31d1a1b70c8e0b5f5a62ded774bb9f1f8bf3e7bc
HORIZON_DEV_BUNDLE=26.3.build.140-beta
MC_VERSION=26.3
