  - id: coupled-save-order
    title: linear.coupled-save.enabled (default true) / .interval (default 20 s) - per region, every chunk holder is saved and the players' .dat/stats/advancements are staged in memory; they are written atomically only after the chunk I/O in flight has landed and the forced storage flush returned (a failed barrier withholds and retries). Logout, Player#saveData and save-all use the same capture, a player leaving a region (cross-region teleport, portal, respawn) triggers a departure capture of the source region, the periodic player autosave is skipped, logins read a staged save first. Player file never newer than its region's chunks; not a cross-region transaction
